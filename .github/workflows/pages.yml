name: Publish LEGO Collection

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lego-collection-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned pnpm
        run: |
          pnpm_prefix="${RUNNER_TEMP}/pnpm-11.19.0"
          npm install --prefix "${pnpm_prefix}" --no-audit --no-fund --ignore-scripts pnpm@11.19.0
          echo "${pnpm_prefix}/node_modules/.bin" >> "${GITHUB_PATH}"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test the collection
        run: pnpm test
      - name: Build the three-set static site
        run: pnpm build
        env:
          COLLECTION_BASE: /LEGO-Collection/
      - name: Upload the static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
